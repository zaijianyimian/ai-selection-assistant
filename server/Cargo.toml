[package]
name = "asa-sync-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
[dependencies]
asa-sync-protocol = { path = "../crates/sync-protocol" }
axum = { version = "0.8", features = ["json", "query", "tokio", "http1"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
